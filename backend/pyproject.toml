[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI — FastAPI web layer: uploads, validation, routing, jobs, artifacts, reports"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["artifacts", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["B008"]  # FastAPI dependency defaults in signatures

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
