<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1100" width="100%" height="100%" style="background:#090d12; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Node Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#07192c"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#280f02"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#24043d"/>
    </linearGradient>
    <linearGradient id="nodeCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d1d"/>
      <stop offset="100%" stop-color="#2d1010"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1020" height="60" rx="10" fill="url(#headerGrad)" stroke="#374151" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="56" fill="#f9fafb" font-size="20" font-weight="700" letter-spacing="0.5">LANGGRAPH STATE MACHINE — LOW-LEVEL ORCHESTRATION ARCHITECTURE</text>
  <rect x="880" y="36" width="160" height="28" rx="6" fill="#065f46" stroke="#059669" stroke-width="1"/>
  <text x="960" y="54" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">12 DISCRETE NODES</text>

  <!-- NODE 1: validate_inputs -->
  <g filter="url(#shadow)">
    <rect x="100" y="105" width="400" height="65" rx="8" fill="url(#nodeBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="130" fill="#38bdf8" font-size="13" font-weight="700">1. validate_inputs</text>
    <text x="120" y="148" fill="#94a3b8" font-size="11">Inspect raster headers, channel counts (RGB, 8-band, Pair)</text>
    <text x="120" y="162" fill="#94a3b8" font-size="11">Verify CRS, resolution &amp; bounds via rasterio</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 300 170 L 300 195" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 2: interpret_query -->
  <g filter="url(#shadow)">
    <rect x="100" y="200" width="400" height="65" rx="8" fill="url(#nodeBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="225" fill="#38bdf8" font-size="13" font-weight="700">2. interpret_query</text>
    <text x="120" y="243" fill="#94a3b8" font-size="11">Extract QueryRequirements (rule/intent based, zero LLM)</text>
    <text x="120" y="257" fill="#94a3b8" font-size="11">Detect measurement queries, temporal transitions &amp; dependencies</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 300 265 L 300 290" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 3: clarification_check -->
  <g filter="url(#shadow)">
    <rect x="100" y="295" width="400" height="70" rx="8" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="320" fill="#fbbf24" font-size="13" font-weight="700">3. clarification_check</text>
    <text x="120" y="338" fill="#fde68a" font-size="11">Check if file roles (before/after) or modalities are missing</text>
    <text x="120" y="352" fill="#fde68a" font-size="11">Condition: needs_clarification?</text>
  </g>

  <!-- HITL Interrupt Branch (Right) -->
  <path d="M 500 330 L 600 330" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="520" y="322" fill="#fde68a" font-size="10">Missing Roles</text>

  <g filter="url(#shadow)">
    <rect x="605" y="295" width="415" height="70" rx="8" fill="#2d1502" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="625" y="320" fill="#fde68a" font-size="12" font-weight="700">LangGraph interrupt()</text>
    <text x="625" y="338" fill="#cbd5e1" font-size="10.5">Execution pauses, saving state to SqliteSaver checkpointer</text>
    <text x="625" y="352" fill="#38bdf8" font-size="10.5">Resume: POST /clarification → claim_graph_resume() guard</text>
  </g>

  <path d="M 810 365 L 810 405 L 505 405" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <text x="640" y="400" fill="#a7f3d0" font-size="10">Atomic single-resume guard</text>

  <!-- Flow 3 -> 4 -->
  <path d="M 300 365 L 300 395" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="382" fill="#93c5fd" font-size="10">All clear</text>

  <!-- NODE 4: constrained_router -->
  <g filter="url(#shadow)">
    <rect x="100" y="400" width="400" height="65" rx="8" fill="url(#nodeBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="425" fill="#38bdf8" font-size="13" font-weight="700">4. constrained_router</text>
    <text x="120" y="443" fill="#94a3b8" font-size="11">Deterministic specialist assignment (Rule 3 &amp; Section 13)</text>
    <text x="120" y="457" fill="#94a3b8" font-size="11">Change detection ➔ ChangeNet | Land cover ➔ SAR-FuseSeg</text>
  </g>

  <!-- Flow 4 -> 5 -->
  <path d="M 300 465 L 300 490" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 5: check_cache -->
  <g filter="url(#shadow)">
    <rect x="100" y="495" width="400" height="60" rx="8" fill="url(#nodeBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="520" fill="#38bdf8" font-size="13" font-weight="700">5. check_cache</text>
    <text x="120" y="538" fill="#94a3b8" font-size="11">Compute SHA-256 analysis key over rasters + query</text>
  </g>

  <!-- Cache Hit Branch (Right) -->
  <path d="M 500 525 L 600 525" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="520" y="518" fill="#a7f3d0" font-size="10">Cache Hit</text>

  <g filter="url(#shadow)">
    <rect x="605" y="495" width="415" height="60" rx="8" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
    <text x="625" y="520" fill="#5eead4" font-size="12" font-weight="700">Cache Bypass Node</text>
    <text x="625" y="538" fill="#ccfbf1" font-size="10.5">Reuses verified result payload without re-running inference</text>
  </g>

  <!-- Flow 5 -> 6 (Cache Miss) -->
  <path d="M 300 555 L 300 580" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="570" fill="#93c5fd" font-size="10">Cache Miss</text>

  <!-- NODE 6: dispatch_specialist -->
  <g filter="url(#shadow)">
    <rect x="100" y="585" width="400" height="75" rx="8" fill="url(#nodePurple)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="120" y="608" fill="#c084fc" font-size="13" font-weight="700">6. dispatch_specialist</text>
    <text x="120" y="626" fill="#e9d5ff" font-size="11">• ChangeNet V3.1: Siamese Transformer difference attention</text>
    <text x="120" y="640" fill="#e9d5ff" font-size="11">• SAR-FuseSeg V3: 8-band dual-stream ResNet-18 (6 opt + 2 SAR)</text>
    <text x="120" y="654" fill="#d8b4fe" font-size="10.5">Outputs: Raw class probability masks</text>
  </g>

  <!-- Flow 6 -> 7 -->
  <path d="M 300 660 L 300 685" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- NODE 7: validate_specialist_output -->
  <g filter="url(#shadow)">
    <rect x="100" y="690" width="400" height="60" rx="8" fill="url(#nodeBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="713" fill="#38bdf8" font-size="13" font-weight="700">7. validate_specialist_output</text>
    <text x="120" y="731" fill="#94a3b8" font-size="11">Assert dimensions match input, check NaN/Inf, assert in [0.0, 1.0]</text>
  </g>

  <!-- Flow 7 -> 8 -->
  <path d="M 300 750 L 300 775" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 8: run_evidence_engine -->
  <g filter="url(#shadow)">
    <rect x="100" y="780" width="400" height="75" rx="8" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="803" fill="#fbbf24" font-size="13" font-weight="700">8. run_evidence_engine</text>
    <text x="120" y="821" fill="#fde68a" font-size="11">• Polygonization via rasterio.features.shapes &amp; shapely</text>
    <text x="120" y="835" fill="#fde68a" font-size="11">• Coordinate reprojection into local UTM projected CRS</text>
    <text x="120" y="849" fill="#fde68a" font-size="11">• Calculates exact ground area in hectares &amp; m² (zero guessing)</text>
  </g>

  <!-- Flow 8 -> 9 -->
  <path d="M 300 855 L 300 880" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- NODE 9: validate_evidence_contract -->
  <g filter="url(#shadow)">
    <rect x="100" y="885" width="400" height="70" rx="8" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="908" fill="#fbbf24" font-size="13" font-weight="700">9. validate_evidence_contract</text>
    <text x="120" y="926" fill="#fde68a" font-size="11">Pre-composition validation (validator.py): Single source of truth</text>
    <text x="120" y="940" fill="#fde68a" font-size="11">Evaluates semantic support (SUPPORTED / UNSUPPORTED / NA)</text>
  </g>

  <!-- Flow 9 -> 10 -->
  <path d="M 300 955 L 300 980" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- NODE 10: confidence_check -->
  <g filter="url(#shadow)">
    <rect x="100" y="985" width="400" height="75" rx="8" fill="url(#nodeGreen)" stroke="#34d399" stroke-width="1.5"/>
    <text x="120" y="1008" fill="#34d399" font-size="13" font-weight="700">10. confidence_check (3-Way Gate)</text>
    <text x="120" y="1026" fill="#a7f3d0" font-size="11">Composite decision: ACCEPT | WARN | ABSTAIN</text>
    <text x="120" y="1040" fill="#a7f3d0" font-size="10.5">Priority: INVALID_CONTRACT &gt; UNSUPPORTED &gt; MISSING &gt; CONFLICT</text>
  </g>

  <!-- Three Decision Branches (10 -> 11a, 11b, 11c) -->
  <path d="M 500 1005 L 600 930" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="520" y="960" fill="#34d399" font-size="10">ACCEPT</text>

  <path d="M 500 1022 L 600 1022" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="520" y="1015" fill="#fbbf24" font-size="10">WARN</text>

  <path d="M 500 1040 L 600 1060" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="1058" fill="#f87171" font-size="10">ABSTAIN</text>

  <!-- NODE 11: Response Nodes (Right) -->
  <g filter="url(#shadow)">
    <rect x="605" y="900" width="415" height="55" rx="8" fill="url(#nodeGreen)" stroke="#10b981" stroke-width="1.5"/>
    <text x="625" y="923" fill="#6ee7b7" font-size="12" font-weight="700">11a. compose_response</text>
    <text x="625" y="941" fill="#a7f3d0" font-size="10.5">SatVLM Prompted Freeze (satvlm-prompted-v1, temp=0.0)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="965" width="415" height="55" rx="8" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="625" y="988" fill="#fde68a" font-size="12" font-weight="700">11b. compose_response_with_warning</text>
    <text x="625" y="1006" fill="#fef3c7" font-size="10.5">Explicit disclosure template on unreconciled specialist conflict</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="1030" width="415" height="55" rx="8" fill="url(#nodeCoral)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="625" y="1053" fill="#fca5a5" font-size="12" font-weight="700">11c. abstention_response</text>
    <text x="625" y="1071" fill="#fee2e2" font-size="10.5">Deterministic refusal template on missing evidence or unsupported transitions</text>
  </g>

  <!-- Connect 11 -> 12 -->
  <path d="M 1020 927 L 1050 927 L 1050 780 L 1020 780" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1020 992 L 1050 992 L 1050 780" stroke="#60a5fa" stroke-width="2"/>
  <path d="M 1020 1057 L 1050 1057 L 1050 780" stroke="#60a5fa" stroke-width="2"/>

  <!-- NODE 12: persist_result -->
  <g filter="url(#shadow)">
    <rect x="605" y="745" width="415" height="70" rx="8" fill="url(#nodeBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="625" y="770" fill="#38bdf8" font-size="13" font-weight="700">12. persist_result &amp; Pre-render Reports</text>
    <text x="625" y="788" fill="#94a3b8" font-size="11">• Commit analysis record &amp; execution trace to database</text>
    <text x="625" y="802" fill="#94a3b8" font-size="11">• Register binary masks, GeoJSON boundaries, HTML &amp; PDF reports</text>
  </g>

</svg>
