services:
  - type: web
    name: satquery-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: SATQUERY_ENV
        value: production
      - key: SATQUERY_DATABASE_URL
        value: postgresql://neondb_owner:npg_aZ3CDn8jpyqQ@ep-quiet-glade-b3ebco86-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_aZ3CDn8jpyqQ@ep-quiet-glade-b3ebco86-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: SATQUERY_CORS_ORIGINS
        value: "*"
      - key: SATQUERY_QUEUE_MODE
        value: inline
      - key: SATQUERY_PIPELINE_MODE
        value: python
      - key: SATQUERY_PIPELINE_CALLABLE
        value: app.pipeline.runner.execute
      # --- Local ML gateways via Cloudflare Tunnel ---
      - key: SATQUERY_SATVLM_REMOTE_URL
        sync: false
        value: https://satvlm.ettalabs.in
      - key: SATQUERY_CHANGENET_URL
        sync: false
        value: https://changenet.ettalabs.in
      - key: SATQUERY_SARFUSE_URL
        sync: false
        value: https://sarfuse.ettalabs.in
